name: iOS Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Download Godot
        run: |
          GODOT_VERSION="4.3"
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_macos.universal.zip
          unzip -q Godot_v${GODOT_VERSION}-stable_macos.universal.zip
          sudo mv Godot.app /Applications/
          
      - name: Setup Godot command
        run: |
          echo '#!/bin/bash' > /usr/local/bin/godot
          echo '/Applications/Godot.app/Contents/MacOS/Godot "$@"' >> /usr/local/bin/godot
          chmod +x /usr/local/bin/godot
          godot --version

      - name: Download iOS export templates
        run: |
          GODOT_VERSION="4.3"
          mkdir -p ~/Library/Application\ Support/Godot/export_templates/${GODOT_VERSION}.stable
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          unzip -q Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          cp -r templates/* ~/Library/Application\ Support/Godot/export_templates/${GODOT_VERSION}.stable/

      # FIX : Nettoyer les UIDs et créer fichiers manquants
      - name: Fix project files
        run: |
          # Créer .env vide
          touch .env
          
          # Backup project.godot
          cp project.godot project.godot.backup
          
          # Remplacer tous les uid:// par des chemins res://
          if grep -q "uid://" project.godot; then
            echo "🔧 Fixing UIDs in project.godot..."
            sed -i.bak 's|config/icon="uid://[^"]*"|config/icon="res://icon.png"|g' project.godot
            sed -i.bak 's|boot_splash/image="uid://[^"]*"|boot_splash/image="res://icon.png"|g' project.godot
          fi
          
          # Vérifier que icon.png existe
          if [ ! -f "icon.png" ] && [ ! -f "icon.svg" ]; then
            echo "⚠️ Pas d'icône trouvée, création d'une icône par défaut"
            # Créer une icône minimale PNG 1x1 transparent
            echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==" | base64 -d > icon.png
          fi
          
          echo "✅ Project files fixed"

      - name: Verify export preset
        run: |
          if [ ! -f "export_presets.cfg" ]; then
            echo "❌ export_presets.cfg missing!"
            exit 1
          fi
          echo "📄 Export presets:"
          cat export_presets.cfg

      - name: Export iOS
        run: |
          mkdir -p build/ios
          godot --headless --export-release "iOS" build/ios/game.xcodeproj 2>&1 | tee export.log || {
            echo "❌ Export failed"
            cat export.log
            exit 1
          }

      - name: Verify export
        run: |
          ls -lah build/ios/
          if [ ! -d "build/ios/game.xcodeproj" ]; then
            echo "❌ game.xcodeproj not found!"
            ls -R build/ios/
            exit 1
          fi

      - name: Find Xcode scheme
        id: find_scheme
        run: |
          cd build/ios
          SCHEME=$(xcodebuild -list -project game.xcodeproj 2>/dev/null | grep -A 100 "Schemes:" | grep -v "Schemes:" | head -1 | xargs)
          if [ -z "$SCHEME" ]; then
            echo "❌ No scheme found!"
            xcodebuild -list -project game.xcodeproj
            exit 1
          fi
          echo "scheme=$SCHEME" >> $GITHUB_OUTPUT
          echo "✅ Found scheme: $SCHEME"

      - name: Build archive
        run: |
          cd build/ios
          xcodebuild \
            -project game.xcodeproj \
            -scheme "${{ steps.find_scheme.outputs.scheme }}" \
            -sdk iphoneos \
            -configuration Release \
            -archivePath "$PWD/game.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            archive 2>&1 | tee build.log || {
              echo "❌ xcodebuild failed"
              tail -100 build.log
              exit 1
            }

      - name: Verify archive
        run: |
          if [ ! -d "build/ios/game.xcarchive" ]; then
            echo "❌ Archive not created!"
            exit 1
          fi
          du -sh build/ios/game.xcarchive
          echo "✅ Archive created successfully"

      - name: Zip archive
        run: |
          cd build/ios
          zip -r -q game.xcarchive.zip game.xcarchive
          ls -lh game.xcarchive.zip

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Godot iOS Build ${{ github.run_number }}
          files: build/ios/game.xcarchive.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
