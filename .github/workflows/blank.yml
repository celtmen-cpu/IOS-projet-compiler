name: iOS Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      # Installer Godot
      - name: Install Godot
        run: |
          brew install godot

      - name: Install Godot templates (clean)
        run: |
          mkdir -p ~/Library/Application\ Support/Godot/export_templates
          godot --headless --quit

      # Export iOS depuis le projet Godot
      - name: Export iOS
        run: |
          mkdir -p build/ios
          godot --headless --export-release "iOS" build/ios

      # Vérifier contenu export
      - name: List files
        run: ls -R build/ios

      # Build archive
      - name: Build archive
        run: |
          cd build/ios
          xcodebuild \
            -project *.xcodeproj \
            -scheme * \
            -sdk iphoneos \
            -configuration Release \
            -archivePath $PWD/game.xcarchive \
            archive

      # Zip archive
      - name: Zip archive
        run: |
          cd build/ios
          zip -r game.xcarchive.zip game.xcarchive

      # Release GitHub
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Godot iOS Build ${{ github.run_number }}
          files: build/ios/game.xcarchive.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
